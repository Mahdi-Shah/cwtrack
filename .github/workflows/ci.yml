name: CI

# Quoted deliberately: bare `on` is read as the boolean True by YAML 1.1, which is
# what pyyaml and most tooling use. GitHub accepts either, but an unquoted key
# makes the file confusing to read and to check with a script.
"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The Jalali fallback table is what runs when jdatetime is absent, so both
      # paths have to be exercised or a broken table ships unnoticed.
      - name: Test (embedded calendar table)
        run: pytest -q

      - name: Test (with jdatetime)
        run: |
          pip install "jdatetime>=2.2"
          pytest -q

      - name: Lint
        run: ruff check src tests

  build:
    name: build wheel
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build
        run: |
          pip install --upgrade pip build
          python -m build

      # The dashboard inlines the fonts from inside the package. If they are not
      # declared as package data they are missing from the wheel, and the page
      # silently falls back to Tahoma - a failure with no error message at all.
      - name: Verify fonts are packaged
        run: |
          python - <<'PY'
          import glob, zipfile, sys
          wheels = glob.glob("dist/*.whl")
          assert wheels, "no wheel produced"
          names = zipfile.ZipFile(wheels[0]).namelist()
          fonts = [n for n in names if n.endswith(".ttf")]
          assert len(fonts) >= 2, "fonts missing from the wheel: {}".format(names)
          print("packaged fonts:", *fonts, sep="\n  ")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # A guard against the mistake that matters most here: committing coursework.
  privacy:
    name: no personal data committed
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A guard against the mistake that matters most here: committing coursework.
      #
      # The patterns match SHAPES, not one person's data. An earlier version listed
      # a real student number and a real name here to be precise - which meant the
      # file written to prevent the leak contained the leak. A 9-digit number
      # beginning 40 is a Sharif student number; anything at sharif.edu is a
      # university address; sesskey is a bearer token.
      - name: No student number, university address or session key in the tree
        run: |
          set -euo pipefail
          PATTERNS='\b40[0-9]{7}\b|[A-Za-z0-9._%-]+@sharif\.edu|sesskey=[A-Za-z0-9]{6,}'
          fails=0

          while read -r hit; do
            echo "ERROR: possible personal data: $hit"
            fails=1
          done < <(git grep -InE "$PATTERNS" -- . || true)

          exit $fails

      - name: Nothing personal is tracked
        run: |
          set -euo pipefail
          fails=0
          while read -r p; do
            [ -z "$p" ] && continue
            echo "ERROR: tracked file that should be ignored: $p"
            fails=1
          done < <(git ls-files cw-data .cw work reports 2>/dev/null || true)
          exit $fails

      - name: No session key anywhere in the history
        run: |
          set -euo pipefail
          # Not just HEAD: a key committed once stays reachable forever.
          if git log -p --all | grep -nE 'sesskey=[A-Za-z0-9]{6,}' ; then
            echo "ERROR: a session key appears in the history."
            echo "       Treat it as a leaked password: reset it, then purge the commit."
            exit 1
          fi
          echo "no session key in any commit"

      - name: Fixtures are sanitised
        run: |
          set -euo pipefail
          # A fixture keeps the real shape and carries no identifiers.
          if git grep -InE '\b40[0-9]{7}\b|[A-Za-z0-9._%-]+@sharif\.edu|sesskey=' -- tests/fixtures ; then
            echo "ERROR: a fixture contains something identifying"
            exit 1
          fi
          echo "fixtures are clean"