[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cwtrack"
version = "0.1.0"
description = "Track your own assignments, deadlines and materials on cw.sharif.ir"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "cwtrack contributors" }]
keywords = ["moodle", "assignments", "sharif", "jalali", "student", "tracker"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Persian",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
    "Topic :: Utilities",
]

# Intentionally zero required dependencies.
#
# Everything is stdlib so that installing this cannot break a student's existing
# environment, and so the calendar works even where a wheel would not. jdatetime
# is optional and only improves Jalali conversion outside the bundled table.
dependencies = []

[project.optional-dependencies]
# Better Jalali coverage for years outside the embedded table (1380-1442).
calendar = ["jdatetime>=2.2"]
# Optional captcha OCR. Pillow does the preprocessing; the engine is the `tesseract`
# binary, which is a system install and NOT something pip can bring:
#   winget install UB-Mannheim.TesseractOCR   /  brew install tesseract
# Without both, nothing changes - a human reads the captcha, as it always did.
# CW_OCR=0 turns it off even when both are present.
ocr = ["Pillow>=9.0"]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
    # Pillow is needed by tests/test_captcha.py, which generates the sample images.
    "Pillow>=9.0",
    # Only for tests/test_repo.py, which reads the workflow YAML to check it.
    # Kept in dev rather than the main list: nothing the tool runs needs it.
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/Mahdi-Shah/cwtrack"
Issues = "https://github.com/Mahdi-Shah/cwtrack/issues"

[project.scripts]
# The wrapper, not cli:main. pip's console-script shim calls the target directly
# and never goes through __main__.py, so pointing this at cli:main would leave the
# installed command printing a traceback where `python -m cwtrack` prints a
# sentence. Both paths must behave the same.
cwtrack = "cwtrack.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Fonts must travel with the package: the dashboard inlines them as data URIs,
# and a named-but-missing font degrades silently to Tahoma.
cwtrack = ["fonts/*.ttf"]

# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error"]

[tool.ruff]
line-length = 96
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # long lines are mostly Persian UI strings; wrapping them hurts readability
    "UP032",  # f-strings over .format(): the Persian strings read better with .format
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert is the point in tests

[tool.coverage.run]
source = ["src/cwtrack"]